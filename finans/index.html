<!DOCTYPE html>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap');
:root{--bg:#F2EFE8;--card:#FBFAF6;--ink:#16233A;--mut:#665F4F;--line:#DDD8CA;--ac:#2F5D8C;--ok:#2F6B4F;--warn:#B3541E;--bad:#A12D2D}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600}h1{font-size:26px;margin:0}h2{font-size:19px;margin:0 0 8px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
button,select,input{font:inherit;color:inherit}
.tab,.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer}
.tab.on{background:var(--ink);color:#F2EFE8;border-color:var(--ink)}
.btn.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
a{color:var(--ac)}
.btn.sm{padding:2px 8px;font-size:12px}
select,input{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end}
.form label{display:block;font-size:12px;color:var(--mut)}
.form input,.form select{width:100%}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--mut);font-weight:600}
td.n,th.n{text-align:right}
.bad{color:var(--bad)}.warn{color:var(--warn)}.ok{color:var(--ok)}.mut{color:var(--mut)}
.done td{opacity:.5;text-decoration:line-through}
.sum{display:flex;flex-wrap:wrap;gap:16px;margin:6px 0 10px;font-size:13px}
.prt,.prm,.pft{display:none}
@media print{body{background:#fff}.noprint{display:none!important}.prt{display:block}.card{border:0;padding:0}.scroll{overflow:visible}table{min-width:0}}
@page{margin:16mm 14mm 18mm;@bottom-right{content:"Sayfa " counter(page) " / " counter(pages);font:10px Inter,sans-serif;color:#8E8670}@bottom-left{content:"Mert Akkuş · Mali Müşavirlik";font:10px Inter,sans-serif;color:#8E8670}}
@media print{.scroll{overflow:visible!important}table{width:100%!important;min-width:0!important}
details.mon table th,details.mon table td,.rt th,.rt td{font-size:9.5px;padding:4px 5px;vertical-align:top;white-space:normal;word-break:break-word}
details.mon table .nw,.rt .nw{white-space:nowrap}
details.mon summary:before{content:""!important}details.mon summary{background:none!important}
.badge{font-size:9px;padding:0 4px}tr{break-inside:avoid}

.badge{font-size:11px;border-radius:6px;padding:1px 6px;border:1px solid var(--line)}
.hero{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#16233A 0%,#22314D 55%,#2F5D8C 100%);color:#F2EFE8;border-radius:16px;padding:18px 22px;margin-bottom:14px;box-shadow:0 6px 18px rgba(22,35,58,.18)}
.hero .hk{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#B8975A;font-weight:700}
.hero h2{font-size:21px;margin:3px 0 2px;color:#FBFAF6}
.hero .hs{font-size:13px;color:#B6C0D2}
.hc{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hero select{background:rgba(255,255,255,.12);color:#F2EFE8;border:1px solid rgba(255,255,255,.3);font-weight:600}
.hero select option{color:#16233A}
.chips{display:flex;gap:6px}
.chip{border:1px solid rgba(255,255,255,.35);background:transparent;color:#F2EFE8;border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:600}
.chip.on{background:#F2EFE8;color:#16233A;border-color:#F2EFE8}
.sub{display:inline-flex;gap:4px;padding:4px;background:#E7E1CF;border-radius:12px;margin-bottom:14px}
.sub button{border:0;background:transparent;padding:8px 18px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--mut)}
.sub button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(22,35,58,.2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.kpi{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px 14px 20px}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.kpi .v{font-size:23px;font-weight:700;margin:4px 0 2px;color:var(--c);font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--mut)}
.ch{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.ch h2{margin:0}
.lgd{display:flex;gap:14px;font-size:12px;color:var(--mut)}
.lgd u{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;text-decoration:none}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:14px}
.g2 .card{margin-bottom:0}
.bar{height:8px;background:#E9E4D4;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px}
.rk{margin-bottom:11px}
.rkh{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:4px}
.stk{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#E9E4D4;margin:6px 0 8px}
.stk i{display:block}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;margin-bottom:16px}
.lg u{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;text-decoration:none}
.rt tr.curm td{background:#F6EDC9}
.rt tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.rt tbody tr:hover td{background:#F1EDDD}
details.mon{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
details.mon summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:12px 14px}
details.mon summary::-webkit-details-marker{display:none}
details.mon summary:before{content:"▸";color:var(--mut);transition:transform .15s}
details.mon[open] summary:before{transform:rotate(90deg)}
details.mon[open] summary{border-bottom:1px solid var(--line);background:#F6F3E8}
.mn{font-size:16px;font-weight:700}
.mc{font-size:12px;color:var(--mut);background:#EDE8D8;border-radius:999px;padding:1px 9px}
.sp{flex:1}
.pa b{color:var(--ok)}.py b{color:var(--warn)}
details.mon .scroll{padding:0 8px 8px}
.dtool{margin-bottom:10px;display:flex;gap:6px}
.badge.bg-ok{background:#E1EEE6;color:var(--ok);border-color:#BFD9C9}
.badge.bg-wn{background:#F8E6D8;color:var(--warn);border-color:#E9C6AB}
.badge.bg-bd{background:#F4DADA;color:var(--bad);border-color:#E3B4B4}
.badge.bg-mu{background:#EDE8D8;color:var(--mut)}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.sub,.dtool{display:none!important}details.mon{break-inside:avoid}}
</style>
</head>

async function init(){
  const {data:{session}}=await db.auth.getSession();

    $("#app").innerHTML='<div class="card">Oturum bulunamadı. Önce <a href="../">panele giriş yapın</a>, sonra bu sayfayı yenileyin.</div>';
    return;
  }

  const r=await db.from("user_data").select("value").eq("user_id",S.user.id).eq("key","muhasebe-clients").maybeSingle();
  const v=r.data&&r.data.value;
  S.clients=Array.isArray(v)?v.map(c=>({id:String(c.id),name:c.name||c.unvan||"(adsız)"})):[];
  await load();
  render();
}
async function load(){
  const {data,error}=await db.from("fin_kayit").select("*").order("due_date",{ascending:true});
  if(error){$("#app").innerHTML='<div class="card bad">Kayıtlar okunamadı: '+esc(error.message)+'<br>finans-kurulum.sql dosyasını Supabase’de çalıştırdınız mı?</div>';throw error}
  S.rows=data||[];
  S.rows.forEach(r=>{if(!S.clients.some(c=>c.id===r.client_id))S.clients.push({id:r.client_id,name:r.client_name})});
}
const cur=()=>S.clients.find(c=>c.id===S.client);
const scope=()=>S.rows.filter(r=>!S.client||r.client_id===S.client);
const plan=()=>scope().filter(r=>KIND[r.kind]);
const ST={onay_bekliyor:"Onayda",onaylandi:"Onaylandı",tahsil_edilemedi:"Tahsil edilemedi"};

function render(){
  const opts=S.clients.slice().sort((a,b)=>a.name.localeCompare(b.name,"tr")).map(c=>'<option value="'+esc(c.id)+'"'+(c.id===S.client?" selected":"")+'>'+esc(c.name)+'</option>').join("");
  const tabs=[["dikkat","Bugün Dikkat Et"]].concat(Object.keys(KIND).map(k=>[k,KIND[k].t]),[["cekrapor","Çek Raporu"],["gunluk","Günlük Finans"],["onay","Ödeme Onayları"],["yogun","Ödeme Yoğunluğu"]]);
  $("#app").innerHTML=
   '<div class="prt"><div class="at"><img alt="Ofis logosu" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGAAAAApCAYAAADKzyycAAAEjklEQVR42tVbIXDbQBDcuAaeaYGmoCPQznimRNDQU2RoaBgoaChQEPiwoECgICDAIMCgICDAoMAgICAgoCAgQKAgIMAgIMCgoOcZ+0f6u3u9JPdY8u+X/Pe3u7eSTz58/oKGI2bGn1peJ/RataLf8PqnAHJmTgpgJdiwNYDIMWcB4ExwT0sAk4qxCMDMup9vtPZDExt00mAFDAAUzKaB5iTMnHNKFBcTALeO8SmAK8f4mubsYkz/u6LDFDx6DZ5+I9h8ABgCmDvGx8LNh6DauPGsYv6M7uO/SUBS8mW4ZMWOMWmMHCd1Tsl2QdiDBZ8jRfK84s3b95+aWPeHAFZsuIoAXJdwSKa89gjABYCtxSFLuk5ZbOhaL3v3s7LmxwAeAfw+9gqYUslqI7XKfKA8/fuQZpRwaCzlUzU/FyiozhNgAn3WMJDBYXki5JB7InkJfEYeFdlqAuYWbpadoAWjYqZ0yjJm0zJhMo0gWZoDlCnhtTUZGtPGRA6cHdJ4wcjSwqHVd3C1JJyeMMTqOv22vORkapVcPQoS/s5ItTPS6C9EkK5maMh8+V3D9chs8EjQKD7v/X2tkM53dP2jgCAtzuZMFUgh45aBNA6iHhQyVdtTtFoBF8zNz63TsqWTp1VLi5INv6PkDxTrFPSZrVCmVlXqFsBN1xVwyuDwVYXXsyQ4kcamgiCfPJSXAfDq0bWXVWPcZQIkWt0Ekqy2Vt+Pc4I5Sawp+T5WR1kVmC4TkDHQY+OsHVIMtzmkTjKN8nMzplJT1PCJ6iQgYW6+EBKVCTRnJYC0BQ7dUil8ctfPu0iABHpeBetMmPEqDinrQ4YKDtHA5y3TH4zgaVf7JoDze2ycbYpDoLAubA7Rwqek8x5oN9JXhl4y7J8C+CNY5yuTyFyYyIThiHscPnNImHVtmQphAzkA8KvpCuD8Hhtn63CI9PTnyiryhU+ugVT7RNoExMzNb2qoEV8O0fYhdeDzNSBkeiWAa1hcWt22LrrikLobyDWQMyiMOk0CEqXfExIyfPuQvMTvCQGfWc3v50XCl0q/xzUvZTZBksiYkYYFwZPU79ng8LGkK54BfHQkM6I5d6EqwNfvaZJDJFWk8Xuk8Lk/f8OMxyESEFqrt8Eh9xaHhITPXXAmoMgnkiRAi7O+HFIE5JCsIc6xgzMBWZ+od0SQkQnX0RJpKPisI6e9EyDZNIlWn3bEISHhsypWjBiYuHyiXkCcdXFISNkZMQdG4/dI4TNEFQy0MvQnw+KnHfg9C4Hs9JWpdeIZwDsH3keEFDfSCgjVsHTJIVqZWjfOGJ/IlPlE/SPYtBAcsrY4JBR8ArpnvjnznY3NB/0AOHsMHJLVrBYXzC4CVsnOJ1pVQRD3WnmBf78YaVN2duX3+L4crCLs3pFodVf5Zwwc5g3Bp4H/y8GuGGHv4VCvBs62QbycdZGVyM4Q8Kn9gYlPFcR2AkJCRigO4fybZUPwadBsRLt77e1JqBANy7hDDgl1gHx/YKKNDMC4T6Uwc2jYDeQPGGbgn5lKNyFyrLW2OGRMB6hwVIvU70nh/+KwNtK/oAhgjpkMIQMAAAAASUVORK5CYII="><span class="dv"></span><div><div class="an">Mert Akkuş</div><div class="as">MALİ MÜŞAVİRLİK</div></div></div></div>'+
   '<div class="top"><h1>Nakit ve Ödemeler</h1><div class="noprint"><button class="btn" onclick="window.print()">PDF indir / Yazdır</button> <a href="../">← Panele dön</a></div></div><div class="prm">Mükellef: '+esc(cur()?cur().name:"Tüm mükellefler")+' &nbsp;·&nbsp; '+tr(ld(new Date()))+'</div>'+
   '<div class="card noprint"><div class="form"><div><label>Mükellef</label><select id="cl"><option value="">Tümü</option>'+opts+'</select></div>'+
   '<div><label>&nbsp;</label><button class="btn" id="man">+ Manuel mükellef</button></div></div></div>'+
   '<div class="tabs noprint">'+tabs.map(t=>'<button class="tab'+(S.tab===t[0]?" on":"")+'" data-t="'+t[0]+'">'+t[1]+'</button>').join("")+'</div>'+
   '<div id="body"></div>';
  $("#cl").onchange=e=>{S.client=e.target.value;render()};
  $("#man").onclick=()=>{const n=(prompt("Mükellef adı:")||"").trim();if(!n)return;const id="m-"+Date.now();S.clients.push({id,name:n});S.client=id;render()};
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render()});
  S.tab==="dikkat"?renderDikkat():KIND[S.tab]?renderList(S.tab):({cekrapor:renderRapor,gunluk:renderGunluk,onay:renderOnay,yogun:renderYogun})[S.tab]();
  moneyWire();
}

function sums(rows){
  const o={};
  rows.forEach(r=>{const k=(KIND[r.kind].out?"Ödenecek":"Tahsil edilecek")+"|"+r.currency;o[k]=(o[k]||0)+Number(r.amount)});
  return Object.keys(o).sort().map(k=>{const p=k.split("|");return '<span><span class="mut">'+p[0]+':</span> <b>'+fmt(o[k],p[1])+'</b></span>'}).join("")||'<span class="mut">Kayıt yok</span>';
}
function table(rows,all){
  if(!rows.length)return '<p class="mut">Kayıt yok.</p>';
  const today=ld(new Date());
  return '<div class="scroll"><table><thead><tr><th>Vade</th>'+(all?'<th>Mükellef</th>':'')+'<th>Tür</th><th>Kişi / banka</th><th>No / not</th><th class="n">Tutar</th><th class="noprint"></th></tr></thead><tbody>'+
   rows.map(r=>{
    const k=KIND[r.kind],late=r.status!=="kapandi"&&r.due_date&&r.due_date<today;
    return '<tr class="'+(r.status==="kapandi"?"done":"")+'"><td class="'+(late?"bad":"")+'">'+tr(r.due_date)+'</td>'+
     (all?'<td>'+esc(r.client_name)+'</td>':'')+
     '<td><span class="badge">'+(k.out?"Ödeme":"Tahsilat")+'</span>'+(ST[r.status]?' <span class="badge '+(r.status==="tahsil_edilemedi"?"bg-bd":"ok")+'">'+ST[r.status]+'</span>':"")+'</td><td>'+esc(r.title)+'</td><td>'+esc(r.ref)+'</td>'+
     '<td class="n">'+fmt(r.amount,r.currency)+'</td>'+
     '<td class="noprint"><button class="btn sm" data-a="t" data-id="'+r.id+'">'+(r.status==="kapandi"?"Geri al":(k.out?"Ödendi":"Tahsil edildi"))+'</button> '+(r.kind==="cek_alinan"&&r.status!=="kapandi"?(r.status==="tahsil_edilemedi"?'<button class="btn sm" data-a="s" data-id="'+r.id+'" data-s="bekliyor">Geri al</button> ':'<button class="btn sm" data-a="s" data-id="'+r.id+'" data-s="tahsil_edilemedi">Tahsil edilemedi</button> '):"")+'<button class="btn sm" data-a="d" data-id="'+r.id+'">Sil</button></td></tr>';
   }).join("")+'</tbody></table></div>';
}
function bind(){
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{
    const r=S.rows.find(x=>x.id===b.dataset.id);if(!r)return;
    if(b.dataset.a==="s")await db.from("fin_kayit").update({status:b.dataset.s}).eq("id",r.id);
    else if(b.dataset.a==="d"){if(!confirm("Bu kayıt silinsin mi?"))return;await db.from("fin_kayit").delete().eq("id",r.id)}
    else await db.from("fin_kayit").update({status:r.status==="kapandi"?"bekliyor":"kapandi"}).eq("id",r.id);
    await load();render();
  });
}
function renderDikkat(){
  const today=ld(new Date()),lim=new Date();lim.setDate(lim.getDate()+14);const end=ld(lim);
  const open=plan().filter(r=>r.status!=="kapandi"&&r.status!=="tahsil_edilemedi"&&r.due_date);
  const fail=plan().filter(r=>r.status==="tahsil_edilemedi"),g=(fail.length?[["Tahsil edilemeyen çekler","bad",fail]]:[]).concat([["Vadesi geçmiş","bad",open.filter(r=>r.due_date<today)],["Bugün","warn",open.filter(r=>r.due_date===today)],["Önümüzdeki 14 gün ("+tr(today)+" – "+tr(end)+")","ok",open.filter(r=>r.due_date>today&&r.due_date<=end)]]);
  $("#body").innerHTML=g.map(x=>'<div class="card"><h2 class="'+x[1]+'">'+x[0]+' ('+x[2].length+')</h2><div class="sum">'+sums(x[2])+'</div>'+table(x[2],!S.client)+'</div>').join("");
  bind();
}
function renderList(kind){
  const k=KIND[kind],rows=scope().filter(r=>r.kind===kind);
  $("#body").innerHTML='<div class="card noprint"><h2>'+k.t+' — yeni kayıt</h2><div class="form">'+
   '<div><label>'+k.a+'</label><input id="f_a"></div><div><label>'+k.b+'</label><input id="f_b"></div>'+
   '<div><label>Tutar</label><input id="f_t" class="money" inputmode="decimal" autocomplete="off" placeholder="0,00"></div>'+
   '<div><label>Para birimi</label><select id="f_c"><option>TRY</option><option>USD</option><option>EUR</option></select></div>'+
   '<div><label>'+(kind==="kredi"?"İlk vade":"Vade")+'</label><input id="f_d" type="date"></div>'+

function fmtLive(el){

  ip=ip.replace(/^0+(?=\d)/,"");if(ip===""&&dp!==null)ip="0";

  const nv=ip+(dp!==null?","+dp:""),keep=old.slice(0,pos).replace(/[^\d,]/g,"").length;
  el.value=nv;

      return '<tr class="'+(isCur&&i===nm?"curm":"")+'"><td><b>'+MON[i]+'</b></td><td class="n">'+(m.an||z)+'</td><td class="n ok">'+(m.an?'<b>'+fmt(m.a,c)+'</b>':z)+'</td><td class="n">'+(m.yn||z)+'</td><td class="n warn">'+(m.yn?'<b>'+fmt(m.y,c)+'</b>':z)+'</td><td class="n '+(n<0?"bad":"ok")+'">'+(has?'<b>'+sgn(n,c)+'</b>':z)+'</td><td class="n '+(cum<0?"bad":cum>0?"ok":"mut")+'">'+(has||cum?sgn(cum,c):z)+'</td></tr>'}).join("");
    out='<div class="kpis">'+kp("Alınan çekler",fmt(TA,c),AN+" çek","var(--ok)")+kp("Yazılan çekler",fmt(TY,c),YN+" çek","var(--warn)")+kp("Net pozisyon",sgn(net,c),"Alınan − yazılan",net<0?"var(--bad)":"var(--ok)")+kp("Vadesi geçmiş açık",lateN+" çek","Tahsil edilmemiş "+fmt(lateA,c)+" · ödenmemiş "+fmt(lateY,c),lateN?"var(--bad)":"var(--mut)")+(failN?kp("Tahsil edilemeyen",failN+" çek","Alınan çek · "+fmt(failA,c),"var(--bad)"):"")+'</div>'+
     '<div class="card"><div class="ch"><h2>Aylık alınan ve yazılan çekler</h2><div class="lgd"><span><u style="background:#2F6B4F"></u>Alınan</span><span><u style="background:#B3541E"></u>Yazılan</span><span><u style="background:#B8975A;opacity:.5"></u>İçinde bulunulan ay</span></div></div><div class="scroll"><div style="min-width:560px">'+chartSVG(M,isCur?nm:-1,c)+'</div></div></div>'+
     '<div class="g2"><div class="card"><h2>Durum dağılımı</h2>'+statBar(rows,"cek_alinan",c,today)+statBar(rows,"cek_yazilan",c,today)+'</div><div class="card"><h2>En çok çek veren (alınan)</h2>'+top5(rows,"cek_alinan",c)+'</div><div class="card"><h2>En çok çek yazılan kişi (yazılan)</h2>'+top5(rows,"cek_yazilan",c)+'</div></div>'+
     '<div class="card"><h2>Ay ay özet</h2><div class="scroll"><table class="rt"><thead><tr><th>Ay</th><th class="n">Alınan adet</th><th class="n">Alınan tutar</th><th class="n">Yazılan adet</th><th class="n">Yazılan tutar</th><th class="n">Net</th><th class="n">Kümülatif net</th></tr></thead><tbody>'+trs+'</tbody><tfoot><tr><td>Toplam</td><td class="n">'+AN+'</td><td class="n ok">'+fmt(TA,c)+'</td><td class="n">'+YN+'</td><td class="n warn">'+fmt(TY,c)+'</td><td class="n '+(net<0?"bad":"ok")+'">'+sgn(net,c)+'</td><td></td></tr></tfoot></table></div></div>';
  }
  $("#body").innerHTML=hero+subs+out;
  document.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>{P.sub=b.dataset.sub;renderRapor()});
  document.querySelectorAll("[data-cur]").forEach(b=>b.onclick=()=>{P.c=b.dataset.cur;renderRapor()});
  $("#ry").onchange=e=>{P.y=+e.target.value;renderRapor()};
}

const NK=s=>String(s==null?"":s).toLocaleLowerCase("tr").replace(/[^a-zçğıöşü0-9]/g,"");
const HM={client:["mukellef","mükellef","musteri","müşteri","firma"],title:["banka","kisi","kişi","lehtar","ceki","çeki","taraf","unvan","ünvan"],ref:["no","not","aciklama","açıklama","ref"],amount:["tutar","miktar"],currency:["parabirimi","doviz","döviz","pb"],due:["vade","tarih"]};
const pnum=v=>{if(typeof v==="number")return v;let s=String(v==null?"":v).replace(/[^\d.,-]/g,"");if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");else if(s.includes(",")&&s.includes("."))s=s.replace(/\./g,"").replace(",",".");else if(s.includes(","))s=s.replace(",",".");return parseFloat(s)};
const okd=s=>{const p=s.split("-").map(Number),d=new Date(p[0],p[1]-1,p[2]);return d.getFullYear()===p[0]&&d.getMonth()===p[1]-1&&d.getDate()===p[2]};
const pdate=v=>{let s;if(typeof v==="number"){const d=new Date(Math.round((v-25569)*864e5));s=d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0")}else{const t=String(v==null?"":v).trim();let m=t.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})$/);if(m)s=m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");else{m=t.match(/^(\d{4})-(\d{2})-(\d{2})/);s=m?m[1]+"-"+m[2]+"-"+m[3]:null}}return s&&okd(s)?s:null};
const pcur=v=>{let s=String(v==null?"":v).trim().toUpperCase().replace("İ","I");s=({"₺":"TRY","$":"USD","€":"EUR","TL":"TRY","":"TRY"})[s]||s;return["TRY","USD","EUR"].includes(s)?s:null};
const HMC={client:HM.client,kisi:["kisi","kişi","lehtar","ceki","çeki","taraf","unvan","ünvan"],banka:["banka"],ref:["cekno","çekno","ceknumarasi","çeknumarası","numara","no","not","aciklama","açıklama","ref"],amount:HM.amount,currency:HM.currency,due:HM.due};
async function tplCek(kind){
  const mk=cur()?cur().name:"",alinan=kind==="cek_alinan",main="FF"+(alinan?"1F5C42":"A0481A"),soft="FF"+(alinan?"E4EFE8":"F6E5D9");
  const solid=c=>({type:"pattern",pattern:"solid",fgColor:{argb:c}});
  const thin={style:"thin",color:{argb:"FFD8D2C2"}},box={top:thin,left:thin,bottom:thin,right:thin};
  const wb=new ExcelJS.Workbook();wb.creator="Nakit ve Ödemeler";wb.created=new Date();
  const ws=wb.addWorksheet("Çek Listesi",{properties:{tabColor:{argb:main}},views:[{state:"frozen",ySplit:3,showGridLines:false}],pageSetup:{orientation:"landscape",fitToPage:true,fitToWidth:1,fitToHeight:0}});
  ws.columns=[{width:26},{width:28},{width:24},{width:20},{width:17},{width:15},{width:16}];
  ws.mergeCells("A1:G1");
  const t=ws.getCell("A1");t.value=(alinan?"ALINAN ÇEKLER":"YAZILAN ÇEKLER")+"  ·  İçe Aktarma Şablonu";
  t.font={name:"Calibri",size:18,bold:true,color:{argb:"FFFBF9F2"}};t.fill=solid(main);t.alignment={vertical:"middle",horizontal:"left",indent:1};ws.getRow(1).height=40;
  ws.mergeCells("A2:G2");
  const st=ws.getCell("A2");st.value=mk?"Mükellef: "+mk+" — mükellef sütunu otomatik dolduruldu, sadece diğer sütunları doldurun.":"Başlıkların altındaki satırlara her çek için bir satır yazın. Mükellef sütununu doldurun.";
  st.font={name:"Calibri",size:10,italic:true,color:{argb:"FF6B7468"}};st.fill=solid("FFF3F0E7");st.alignment={vertical:"middle",horizontal:"left",indent:1};ws.getRow(2).height=22;
  const heads=["Mükellef","Kişi","Banka","Çek numarası","Tutar","Para birimi","Vade"],hr=ws.getRow(3);hr.height=30;
  heads.forEach((h,i)=>{const c=hr.getCell(i+1);c.value=h;c.font={name:"Calibri",size:11,bold:true,color:{argb:"FFFBF9F2"}};c.fill=solid("FF1C2620");c.alignment={vertical:"middle",horizontal:i===4?"right":(i>=5?"center":"left"),indent:i===4?0:1};c.border={top:thin,left:thin,right:thin,bottom:{style:"medium",color:{argb:"FFC9A227"}}}});
  ws.autoFilter="A3:G3";
  const N=150;
  for(let r=4;r<4+N;r++){
    const row=ws.getRow(r);row.height=22;
    for(let c=1;c<=7;c++){
      const cell=row.getCell(c);cell.fill=solid((r%2)?"FFFBF9F2":soft);cell.border=box;cell.font={name:"Calibri",size:11,color:{argb:"FF1C2620"}};
      cell.alignment={vertical:"middle",horizontal:c===5?"right":(c>=6?"center":"left"),indent:(c<=4)?1:0};
      if(c===1&&mk)cell.value=mk;
      if(c===4)cell.numFmt="@";
      if(c===5){cell.numFmt="#,##0.00";cell.dataValidation={type:"decimal",operator:"greaterThan",allowBlank:true,formulae:[0],showErrorMessage:true,errorTitle:"Geçersiz tutar",error:"Tutar 0’dan büyük bir sayı olmalıdır."}}
      if(c===6)cell.dataValidation={type:"list",allowBlank:true,formulae:['"TRY,USD,EUR"'],showErrorMessage:true,errorTitle:"Geçersiz para birimi",error:"TRY, USD veya EUR seçin."};
      if(c===7){cell.numFmt="dd.mm.yyyy";cell.dataValidation={type:"date",operator:"greaterThan",allowBlank:true,formulae:[new Date(2000,0,1)],showErrorMessage:true,errorTitle:"Geçersiz vade",error:"Vadeyi GG.AA.YYYY biçiminde bir tarih olarak girin."}}
    }
  }
  const g=wb.addWorksheet("Nasıl Doldurulur",{properties:{tabColor:{argb:"FFC9A227"}},views:[{showGridLines:false}]});
  g.columns=[{width:26},{width:28},{width:24},{width:20},{width:17},{width:15},{width:16}];
  g.mergeCells("A1:G1");const gt=g.getCell("A1");gt.value="Nasıl doldurulur?";gt.font={name:"Calibri",size:18,bold:true,color:{argb:"FFFBF9F2"}};gt.fill=solid(main);gt.alignment={vertical:"middle",indent:1};g.getRow(1).height=40;
  ["1.  Verileri “Çek Listesi” sayfasında, 3. satırdaki başlıkların altına yazın; başlıkları değiştirmeyin.",
   "2.  Her satır bir çektir.",
   mk?"3.  Mükellef sütunu panelde seçili mükellef ("+mk+") ile hazır geldi; değiştirmenize gerek yok.":"3.  Panelde mükellef seçmediğiniz için Mükellef sütununu her satırda doldurun.",
   "4.  "+(alinan?"Kişi: çeki veren.":"Kişi: lehtar (çeki alan).")+" Banka ve çek numarası isteğe bağlıdır.",
   "5.  Tutar sayı olarak, vade GG.AA.YYYY biçiminde yazılmalıdır.",
   "6.  Para birimi boş bırakılırsa TRY kabul edilir; TRY, USD veya EUR seçebilirsiniz."
  ].forEach((m,i)=>{const r=i+3;g.mergeCells("A"+r+":G"+r);const c=g.getCell("A"+r);c.value=m;c.font={name:"Calibri",size:11,color:{argb:"FF1C2620"}};c.alignment={vertical:"middle",indent:1};g.getRow(r).height=24});
  g.mergeCells("A10:G10");const et=g.getCell("A10");et.value="Örnek satır";et.font={name:"Calibri",size:12,bold:true,color:{argb:main}};et.alignment={vertical:"middle",indent:1};g.getRow(10).height=26;
  heads.forEach((h,i)=>{const c=g.getRow(11).getCell(i+1);c.value=h;c.font={name:"Calibri",size:11,bold:true,color:{argb:"FFFBF9F2"}};c.fill=solid("FF1C2620");c.border=box;c.alignment={vertical:"middle",horizontal:i===4?"right":(i>=5?"center":"left"),indent:i===4?0:1}});
  [mk||"Örnek Ltd.","Ahmet Yılmaz","Ziraat Bankası","000123","25.000,00","TRY","31.10.2026"].forEach((v,i)=>{const c=g.getRow(12).getCell(i+1);c.value=v;c.font={name:"Calibri",size:11,italic:true,color:{argb:"FF6B7468"}};c.fill=solid(soft);c.border=box;c.alignment={vertical:"middle",horizontal:i===4?"right":(i>=5?"center":"left"),indent:i===4?0:1}});
  g.getRow(11).height=26;g.getRow(12).height=24;
  const buf=await wb.xlsx.writeBuffer(),a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
  a.download="sablon-"+(alinan?"alinan-cekler":"yazilan-cekler")+".xlsx";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function wireImport(kind){
  $("#tpl").onclick=()=>{if(kind!=="kredi"&&typeof ExcelJS!=="undefined")return tplCek(kind);const ws=XLSX.utils.aoa_to_sheet([["Mükellef","Banka / kişi","No / not","Tutar","Para birimi","Vade"],[cur()?cur().name:"Örnek Ltd.","Ziraat","1/12",1000,"TRY","31.10.2026"]]),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Kayıtlar");XLSX.writeFile(wb,"sablon-"+kind+".xlsx")};
  $("#xf").onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    let aoa;try{const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:""})}catch(x){$("#xp").innerHTML='<p class="bad">Dosya okunamadı: '+esc(x.message)+'</p>';return}
    const cek=kind!=="kredi",H=cek?HMC:HM;
    const detect=row=>{const c={};(row||[]).forEach((v,i)=>{const n=NK(v);if(!n)return;for(const k in H)if(!(k in c)&&H[k].some(a=>n.includes(NK(a)))){c[k]=i;break}});return c};
    let hi=0,col=detect(aoa[0]);
    for(let i=0;i<Math.min(aoa.length,10);i++){const c=detect(aoa[i]);if("amount" in c&&"due" in c){hi=i;col=c;break}}
    const g=(r,k)=>k in col?String(r[col[k]]==null?"":r[col[k]]).trim():"";
    const miss=["amount","due"].filter(k=>!(k in col));
    if(miss.length){$("#xp").innerHTML='<p class="bad">Zorunlu sütun bulunamadı: '+miss.map(k=>k==="amount"?"Tutar":"Vade").join(", ")+'. İlk satır başlık olmalı.</p>';return}
    const out=[],err=[],made={};
    aoa.slice(hi+1).forEach((r,i)=>{
      if(r.every((x,j)=>j===col.client||String(x).trim()===""))return;
      const no=hi+i+2,nm=String(r[col.client]==null?"":r[col.client]).trim();let cid,cnm;
      if(nm){const c=S.clients.find(x=>NK(x.name)===NK(nm))||made[NK(nm)]||(made[NK(nm)]={id:"m-"+Date.now()+"-"+Object.keys(made).length,name:nm});cid=c.id;cnm=c.name}
      else if(S.client&&cur()){cid=S.client;cnm=cur().name}
      else return err.push("Satır "+no+": mükellef yok (sütunu doldurun ya da mükellef seçin)");
      const amt=pnum(r[col.amount]),d=pdate(r[col.due]),c=col.currency==null?"TRY":pcur(r[col.currency]);
      if(!(amt>0))return err.push("Satır "+no+": tutar geçersiz");
      if(!d)return err.push("Satır "+no+": vade geçersiz");
      if(!c)return err.push("Satır "+no+": para birimi geçersiz (TRY, USD, EUR)");
      out.push({client_id:cid,client_name:cnm,kind,title:cek?[g(r,"kisi"),g(r,"banka")].filter(Boolean).join(" / "):g(r,"title"),ref:g(r,"ref"),amount:amt,currency:c,due_date:d});
    });
    const kf=r=>[r.client_id,r.kind,NK(r.title),NK(r.ref),(+r.amount).toFixed(2),r.currency,r.due_date].join("|");
    const have=new Set(S.rows.map(kf)),seen=new Set(),nw=[],dup=[];
    out.forEach(r=>{const k=kf(r);if(have.has(k)||seen.has(k))dup.push(r);else{seen.add(k);nw.push(r)}});
    const ins=async list=>{for(let i=0;i<list.length;i+=500){const {error}=await db.from("fin_kayit").insert(list.slice(i,i+500));if(error)return alert("Kaydedilemedi: "+error.message)}await load();render()};
    $("#xp").innerHTML='<p><b>'+nw.length+'</b> yeni kayıt, <b class="'+(err.length?"bad":"")+'">'+err.length+'</b> hatalı satır'+(dup.length?', <b class="warn">'+dup.length+'</b> tekrar kayıt (atlanacak)':'')+'.</p>'+(dup.length&&!nw.length?'<p class="warn">Dosyadaki kayıtlar zaten kayıtlı görünüyor, bu yüzden hiçbiri eklenmeyecek.</p>':'')+(dup.length?'<p class="mut">Tekrar sayılan örnekler: '+dup.slice(0,3).map(r=>esc((r.title||"—")+" · "+(r.ref||"—")+" · "+fmt(r.amount,r.currency)+" · "+tr(r.due_date))).join(" ; ")+'</p>':'')+(err.length?'<ul class="bad">'+err.slice(0,20).map(x=>'<li>'+esc(x)+'</li>').join("")+(err.length>20?'<li>… ve '+(err.length-20)+' satır daha</li>':"")+'</ul>':"")+(nw.length?'<button class="btn pri" id="imp">'+nw.length+' yeni kaydı içe aktar</button> ':"")+(dup.length?'<button class="btn" id="impall">Tekrarlıları da ekle ('+dup.length+')</button>':"");
    if(nw.length)$("#imp").onclick=()=>ins(nw);
    if(dup.length)$("#impall").onclick=()=>{if(confirm("Zaten kayıtlı görünen "+dup.length+" kayıt da eklenecek. Emin misiniz?"))ins(nw.concat(dup))};
  };
}

window.addEventListener("afterprint",()=>document.querySelectorAll("details.mon").forEach(d=>{d.open=d.dataset.was==="1"}));
