<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mert Akkuş · Mali Müşavirlik Paneli</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  #boot-status { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: #F3F0E7; color: #1C2620; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; }
  #boot-status-box { max-width: 420px; padding: 20px; border: 1px solid #D8D2C2; border-radius: 12px; background: #FBF9F2; }
  #boot-status-message { margin: 0; }
  #boot-status-retry { display: none; margin: 14px auto 0; border: 0; border-radius: 8px; padding: 9px 14px; background: #1C2620; color: #F1EEE3; cursor: pointer; }
  #boot-status.is-error #boot-status-retry { display: block; }
</style>
  <script type="module" crossorigin src="./index-JwMLJTnI.js"></script>
  <link rel="stylesheet" crossorigin href="./index-BComJHCm.css">
</head>
<body>
<div id="boot-status">
  <div id="boot-status-box">
    <p id="boot-status-message">Panel yükleniyor…</p>
    <button id="boot-status-retry" type="button" onclick="window.location.reload()">Tekrar Dene</button>
  </div>
</div>
<div id="root"></div>
<script>
  (() => {
    const showBootError = () => {
      const status = document.getElementById('boot-status');
      const message = document.getElementById('boot-status-message');
      if (!status || !message) return;
      status.classList.add('is-error');
      message.textContent = navigator.onLine === false
        ? 'İnternet bağlantısı yok. Bağlantınızı kontrol edip tekrar deneyin.'
        : 'Panel başlatılamadı. Bağlantınızı kontrol edip tekrar deneyin.';
    };
    window.addEventListener('error', (event) => {
      if (event.filename || event.error) showBootError();
    });
    window.addEventListener('unhandledrejection', showBootError);
  })();
</script>
</body>
</html>
